<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darmie</title>
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-view">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-icon">⬡</span>
            <span class="brand-name">Darmie</span>
        </div>
        <p class="auth-tagline">Voice · Video · Chat · File transfer</p>

        <div class="auth-tabs">
            <button 
                class="auth-tab active" 
                data-form="login-form">Sign in
            </button>

            <button 
                class="auth-tab"        
                data-form="register-form">Create account
            </button>
        </div>

        <!-- Login -->
        <div id="login-form" class="auth-form">
            <label class="field-label">Username</label>
            <input id="login-username"  
                class="field-input" 
                type="text"     
                placeholder="your_username" 
                autocomplete="username">
            <label class="field-label">Password</label>
            <input id="login-password"  
                class="field-input" 
                type="password" 
                placeholder="••••••••"       
                autocomplete="current-password">
            <button id="login-btn" 
                class="btn btn-primary">Sign in</button>
        </div>

        <!-- Register -->
        <div id="register-form" class="auth-form hidden">
            <label class="field-label">Username 
                <span class="hint">(3–20 chars, a–z 0–9 _)</span>
            </label>
            <input id="register-username" 
                class="field-input" 
                type="text"     
                placeholder="your_username"  
                autocomplete="username">
            <label class="field-label">Password 
                <span class="hint">(min 8 chars)</span>
            </label>
            <input id="register-password" 
                class="field-input" 
                type="password" 
                placeholder="••••••••"        
                autocomplete="new-password">
            <button id="register-btn" 
                class="btn btn-primary">Create account</button>
        </div>

        <div id="auth-error" class="auth-error hidden"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app-view" class="hidden">

    <!-- Left sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-brand">⬡ Darmie</span>
        </div>

        <div class="sidebar-section">
            <div class="section-heading">
                <span>Rooms</span>
                <button id="create-room-btn"
                    class="icon-btn" title="Create room" data-icon="plus"></button>
            </div>
            <ul id="room-list"></ul>
        </div>

        <div class="sidebar-footer">
            <div id="user-avatar" 
                class="avatar" 
                style="width:36px;height:36px;font-size:16px"></div>
            <span id="user-name" 
                class="sidebar-username"></span>
            <button id="logout-btn"
                class="icon-btn danger"
                title="Disconnect" data-icon="power"></button>
        </div>
    </aside>

    <!-- Main content -->
    <main id="main-area">

        <div id="no-room" class="placeholder">
            <div class="placeholder-icon">💬</div>
            <p>Join a room to start chatting</p>
        </div>

        <div id="room-view" class="hidden">

            <!-- Top bar -->
            <header id="top-bar">
                <div class="room-title">
                    <span class="room-hash">#</span>
                    <span id="room-name-display"></span>
                </div>
                <div class="media-controls">
                    <button id="btn-audio"
                        class="ctrl-btn"
                        title="Start microphone" data-icon="mic"></button>
                    <button id="btn-video"
                        class="ctrl-btn"
                        title="Start camera" data-icon="camera"></button>
                    <button id="btn-screen"
                        class="ctrl-btn"
                        title="Share screen" data-icon="screen"></button>
                    <button id="btn-leave"
                        class="ctrl-btn danger"
                        title="Leave room" data-icon="leave"></button>
                </div>
            </header>

            <!-- Video grid (hidden until at least one stream) -->
            <div id="video-grid" class="hidden"></div>

            <!-- Chat messages -->
            <div id="messages"></div>

            <!-- Input bar -->
            <div id="input-bar">
                <label class="file-label" title="Send a file">
                    <span data-icon="paperclip"></span>
                    <input type="file" id="file-input">
                </label>
                <input type="text"
                       id="msg-input"
                       placeholder="Message…"
                       maxlength="2000"
                       autocomplete="off">
                <button id="send-btn" class="btn btn-send">Send</button>
            </div>

        </div><!-- /room-view -->
    </main>

    <!-- Right panel: users -->
    <aside id="users-panel">
        <div class="panel-heading">Users</div>
        <ul id="user-list"></ul>
    </aside>

</div><!-- /app-view -->

<!-- CREATE ROOM MODAL -->
<div id="create-room-modal" class="modal-backdrop hidden">
    <div class="modal-box">
        <h3 class="modal-title">Create a room</h3>
        <label class="field-label">Room name</label>
        <input id="room-name-input" 
               class="field-input" 
               type="text" 
               placeholder="general" 
               maxlength="50">
        <div class="modal-actions">
            <button id="cancel-room-btn"  class="btn">Cancel</button>
            <button id="confirm-room-btn" class="btn btn-primary">Create</button>
        </div>
    </div>
</div>

<!-- Toast container -->
<div id="toasts"></div>

<script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
